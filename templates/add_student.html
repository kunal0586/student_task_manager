{% extends 'layout.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
</head>
<body>
    <h1>Add Student</h1> 
    <form action="/add_student/" method="POST">

        <div class="form-label">

            <div class="col-md-6">
                <label class="form-label">
                    First Name:
                </label><br>

                <input 
                    type="text"
                    name="first_name" 
                    class="form-control"
                    required
                >

            </div>

            <div class="col-md-6">
                <label class="form-label">
                    Last Name:
                </label><br>

                <input 
                    type="text" 
                    name="last_name" 
                    class="form-control" 
                    required
                >
            
            </div>

        </div>
    
        <div class="row mt-3">

            <div class="col-md-4">

                <label class="form-label">
                    Gender:
                </label><br>

                <select 
                    name="gender"
                    class="form-control"
                    required
                >
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="col-md-4">

                <label class="form-label">
                    Mobile Number:
                </label><br>
                <input 
                    type="text" 
                    name="mobile_number" 
                    class="form-control" 
                    required
                >
            </div>

            <div class="col-md-4">

                <label class="form-label">
                Course Name:
                </label><br>

                <input 
                    type="text" 
                    name="course_name" 
                    class="form-control" 
                    required
                >
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-12">
                <label class="form-label">
                    Email Address:
                </label><br>

                <input 
                    type="email" 
                    name="email" 
                    class="form-control" 
                    required
                >
            </div>

            <div class="col-md-12 mt-3">
                <label class="form-label">
                    Admission Date:
                </label><br>    
                <input 
                    type="date" 
                    name="admission_date" 
                    class="form-control" 
                    required
                >
            </div>

         </div><br>


         <button type="submit" class="btn btn-primary mt-4">
            Save Student
        </button>


        
 
    </form>

</body>
</html>
{% endblock %}
